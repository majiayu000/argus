name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short

jobs:
  check:
    name: fmt + clippy + test + corpus + release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: Sigstore feature integration tests
        run: cargo test -p argus-fetch --features sigstore --test sigstore_integration

      - name: argus corpus test
        run: cargo run -q -p argus-cli -- corpus test --corpus corpus

      - name: Argus release contract tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_*.py'

      - name: Synthetic benchmark contract self-test
        run: python3 eval/benchmark/tests/run_fixture_test.py

      - name: AI review labeling contract tests
        shell: bash
        run: |
          python3 -m unittest discover -s eval/labeling/tests -p 'test_*.py'
          python3 eval/labeling/tests/run_fixture_test.py
          python3 eval/labeling/export_assignments.py \
            --reviewer-id ci-contract-reviewer \
            --reviewer-model fixture-model \
            --out-dir target/labeling-assignments

      - name: Verify frozen single-AI review
        shell: bash
        run: |
          python3 eval/labeling/finalize_review.py \
            --review eval/labeling/frozen/reviewer.csv \
            --out-dir target/frozen-agent-review
          cmp eval/labeling/frozen/final_labels.jsonl target/frozen-agent-review/final_labels.jsonl
          cmp eval/labeling/frozen/review_report.json target/frozen-agent-review/review_report.json
          cmp eval/labeling/frozen/unresolved.csv target/frozen-agent-review/unresolved.csv
          python3 eval/labeling/evaluate_current.py roots \
            > target/agent-benchmark-roots.txt

      - name: Check out pinned agent benchmark source
        shell: bash
        run: |
          source_dir="$GITHUB_WORKSPACE/target/agent-benchmark-source"
          git init "$source_dir"
          git -C "$source_dir" remote add origin \
            https://github.com/majiayu000/claude-skill-registry-data
          git -C "$source_dir" sparse-checkout init --cone
          git -C "$source_dir" sparse-checkout set --stdin \
            < target/agent-benchmark-roots.txt
          git -C "$source_dir" fetch --depth=1 --filter=blob:none origin \
            0cd5e5daa71a0fd8e5de723904e5f33fb6e5eed3
          git -C "$source_dir" checkout --detach FETCH_HEAD

      - name: Current agent benchmark quality gate
        shell: bash
        run: |
          cargo build -p argus-cli
          python3 eval/labeling/evaluate_current.py evaluate \
            --source-repo target/agent-benchmark-source \
            --argus target/debug/argus \
            --out target/current-agent-quality.json

      - name: Check whitespace
        shell: bash
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check "HEAD^...HEAD"
          fi

      - name: Generate clean SARIF smoke result
        shell: bash
        run: |
          mkdir -p target/argus-sarif-smoke
          printf '%s\n' '{"name":"argus-sarif-smoke","version":"1.0.0"}' > target/argus-sarif-smoke/package.json
          cargo run -q -p argus-cli -- scan target/argus-sarif-smoke --format sarif > target/argus-sarif-smoke.sarif

      - name: Validate finding SARIF structure
        shell: bash
        run: |
          set +e
          cargo run -q -p argus-cli -- scan corpus/fixtures/lifecycle-curl-sh --format sarif > target/argus-sarif-findings.sarif
          scan_status=$?
          set -e
          test "$scan_status" -eq 1
          jq -e '(.runs[0].tool.driver.rules | length) > 0 and (.runs[0].results | all(.ruleId and .locations[0].physicalLocation.artifactLocation.uri and .partialFingerprints["argusFinding/v1"]))' target/argus-sarif-findings.sarif

      - name: Upload SARIF smoke result
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a
        with:
          sarif_file: target/argus-sarif-smoke.sarif
          category: argus-sarif-smoke

  windows-proc-macro-regressions:
    name: windows proc-macro regressions
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88.0"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Test complete proc-macro regression set
        run: cargo test -p argus-crates proc_macro

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          # Keep in sync with `rust-version` in Cargo.toml.
          toolchain: "1.88"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo check on MSRV
        run: cargo check --workspace --all-targets --all-features

  deps-audit:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources
