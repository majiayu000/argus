name: Joined parsed JSON array refs
on: pull_request_target
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ join(fromJSON(format('["refs/pull/{0}/head"]', github.event.pull_request.number)), '') }}
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ join(fromJSON(format('["refs","pull","{0}","merge"]', github.event.number)), '/') }}
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ join(fromJSON(format('["refs/pull/","{0}","/head"]', github.event.number)), '') }}
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/pull/${{ fromJSON(format('[{0}]', github.event.pull_request.number))[0] }}/head
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/pull/${{ fromJSON(format('{{"number":{0}}}', github.event.number)).number }}/merge
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/pull/${{ fromJSON(format('{{"pull":[{{"number":{0}}}]}}', github.event.number)).pull[0].number }}/head
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/pull/${{ github.event.action != 'opened' && '42' || github.event.number }}/head
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/pull/${{ github.event[format('num{0}', 'ber')] }}/head
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/pull/${{ GitHub.Event.Workflow_Run.Pull_Requests[format('{0}', '0')].Number }}/head
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/pull/${{ !true || github.event.number }}/head
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/pull/${{ fromJSON(format('{0}.0', github.event.number)) }}/head
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/pull/${{ fromJSON(format('[{0}]', github.event.number))[0.5] }}/head
