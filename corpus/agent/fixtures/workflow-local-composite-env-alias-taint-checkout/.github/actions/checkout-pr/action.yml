name: checkout-pr
description: Check out a caller-supplied ref via env alias input
inputs:
  ref:
    description: Git ref to check out
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ inputs.ref }}
