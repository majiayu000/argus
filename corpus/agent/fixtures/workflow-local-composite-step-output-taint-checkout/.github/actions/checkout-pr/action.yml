name: checkout-pr
description: Check out a caller-supplied ref via step output indirection
inputs:
  ref:
    description: Git ref to check out
    required: true
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      run: echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: ${{ steps.resolve.outputs.ref }}
