[workspace]
resolver = "2"
members = [
    "crates/argus-core",
    "crates/argus-transport",
    "crates/argus-rules",
    "crates/argus-fetch",
    "crates/argus-pypi",
    "crates/argus-rubygems",
    "crates/argus-crates",
    "crates/argus-composer",
    "crates/argus-maven",
    "crates/argus-nuget",
    "crates/argus-go",
    "crates/argus-intel",
    "crates/argus-lockfile",
    "crates/argus-osv",
    "crates/argus-agent",
    "crates/argus-cli",
    "crates/argus-test-support",
    "crates/argus-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/majiayu000/argus"
# Verified against the committed Cargo.lock (`cargo +1.88.0 check
# --workspace --all-targets`); the lockfile is v4 (needs cargo >= 1.78) and
# `time` 0.3.47 needs rustc 1.88. Enforced by the `msrv` CI job — keep the
# job's toolchain in sync when bumping this.
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
regex = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
semver = "1"
pep440_rs = "0.7.3"
polycvss = "0.4"
unicode_categories = "0.1.1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
toml = "0.8.23"
yaml-rust2 = { version = "0.8.1", default-features = false }

argus-core = { path = "crates/argus-core", version = "0.1.0" }
argus-transport = { path = "crates/argus-transport", version = "0.1.0" }
argus-agent = { path = "crates/argus-agent", version = "0.1.0" }
argus-rules = { path = "crates/argus-rules", version = "0.1.0" }
argus-fetch = { path = "crates/argus-fetch", version = "0.1.0" }
argus-pypi = { path = "crates/argus-pypi", version = "0.1.0" }
argus-rubygems = { path = "crates/argus-rubygems", version = "0.1.0" }
argus-crates = { path = "crates/argus-crates", version = "0.1.0" }
argus-composer = { path = "crates/argus-composer", version = "0.1.0" }
argus-maven = { path = "crates/argus-maven", version = "0.1.0" }
argus-nuget = { path = "crates/argus-nuget", version = "0.1.0" }
argus-go = { path = "crates/argus-go", version = "0.1.0" }
argus-intel = { path = "crates/argus-intel", version = "0.1.0" }
argus-lockfile = { path = "crates/argus-lockfile", version = "0.1.0" }
argus-osv = { path = "crates/argus-osv", version = "0.1.0" }
argus-test-support = { path = "crates/argus-test-support", version = "0.1.0" }
argus-verify = { path = "crates/argus-verify", version = "0.1.0" }

# fetch-only deps (HTTP + crypto + archive) live in argus-fetch / argus-pypi.
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
hex = "0.4"
tempfile = "3"
subtle = "2"
tree-sitter = "0.24.7"
tree-sitter-bash = "0.23.3"
tree-sitter-python = "0.23.6"
tree-sitter-javascript = "0.23.1"
tree-sitter-typescript = "0.23.2"

# argus-verify (Sigstore) deps. DSSE signature verification (M2 Day 1) uses the
# RustCrypto stack directly; the heavier `sigstore` crate (Fulcio chain + Rekor)
# arrives in a later milestone. See docs/design/sigstore-verification.md.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ecdsa = "0.16"
x509-cert = "0.2"
spki = "0.7"
rcgen = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
rustix = { version = "1", features = ["fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
