schema_version: 1
rules:
  - { id: "ai-context-poisoning", description: "Writes to an AI-agent context file (.cursorrules, CLAUDE.md, ...), planting instructions that persist across sessions", policy_class: blocking, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "ai-context-poisoning" } }
  - { id: "binary-execution", description: "Executes a bundled native binary at install time", policy_class: blocking, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "binary-execution" } }
  - { id: "binary-file", description: "Package ships a native binary artifact", policy_class: blocking, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "binary-file" } }
  - { id: "credential-access", description: "References host secret files or credentials (.npmrc/.env/.ssh/.aws)", policy_class: blocking, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "credential-access" } }
  - { id: "credential-exfiltration-chain", description: "Combines a sensitive credential read with off-host network egress in one executable file", policy_class: blocking, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "credential-exfiltration-chain" } }
  - { id: "dependency-confusion", description: "Unscoped internal-looking package name (dependency-confusion candidate)", policy_class: blocking, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "dependency-confusion" } }
  - { id: "encoded-dynamic-execution", description: "Decodes an encoded payload directly into dynamic execution", policy_class: approval-only, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "encoded-dynamic-execution" } }
  - { id: "github-write-api", description: "Calls the GitHub API with a mutating method (PUT/POST/PATCH/DELETE)", policy_class: blocking, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "github-write-api" } }
  - { id: "implicit-node-gyp-build", description: "binding.gyp triggers npm's implicit node-gyp install build", policy_class: approval-only, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "implicit-node-gyp-build" } }
  - { id: "known-native-build-pattern", description: "Matches a well-known legitimate native-build package pattern (esbuild/sharp/fsevents-like)", policy_class: downgrade-safe, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "known-native-build-pattern" } }
  - { id: "lifecycle-script", description: "Declares an install-time lifecycle script", policy_class: downgrade-safe, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "lifecycle-script" } }
  - { id: "low-reputation", description: "Typosquat-adjacent name with no established reputation", policy_class: blocking, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "low-reputation" } }
  - { id: "network-exfiltration", description: "Performs statically resolved off-host network egress", policy_class: blocking, default_severity: detector-owned, help_uri: "https://github.com/majiayu000/argus#rule-coverage-milestone-0", languages: [], matcher: { kind: builtin, name: "network-exfiltration" } }
